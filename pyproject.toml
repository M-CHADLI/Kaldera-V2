[project]
name = "kaldera"
version = "0.3.0"
description = "Traitement des demandes de remboursement d'assurance par une équipe d'agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "httpx>=0.27,<0.30",
    "pydantic>=2.7,<3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-azure-ai>=0.1,<0.2",
    "langgraph>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaldera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["kaldera"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
