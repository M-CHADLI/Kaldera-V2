<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Kaldera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  /* Carte zoomable : une toile SVG à zoom sémantique (les détails apparaissent avec le zoom) + un panneau explicatif.
     Mode présentation : la carte prend tout l'écran et un bandeau raconte l'étape en cours, exigence par exigence. */
  :root {
    --bg: #F4F6F9; --card: #FFFFFF; --ink: #0F172A; --ink2: #475569; --line: #CBD5E1; --grid: #DDE3EC;
    --ok: #15803D; --ok-s: #DCFCE7; --amb: #B45309; --amb-s: #FEF3C7; --blu: #1D4ED8; --blu-s: #DBEAFE; --mut-s: #E9EDF3;
    --ombre: rgba(15,23,42,.14);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1220; --card: #111A2E; --ink: #E6EBF3; --ink2: #9AA7BB; --line: #334155; --grid: #1B2740;
      --ok: #4ADE80; --ok-s: rgba(74,222,128,.12); --amb: #FBBF24; --amb-s: rgba(251,191,36,.12);
      --blu: #7AA2FF; --blu-s: rgba(122,162,255,.12); --mut-s: #18233A; --ombre: rgba(0,0,0,.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1220; --card: #111A2E; --ink: #E6EBF3; --ink2: #9AA7BB; --line: #334155; --grid: #1B2740;
    --ok: #4ADE80; --ok-s: rgba(74,222,128,.12); --amb: #FBBF24; --amb-s: rgba(251,191,36,.12);
    --blu: #7AA2FF; --blu-s: rgba(122,162,255,.12); --mut-s: #18233A; --ombre: rgba(0,0,0,.45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding-inline: 16px; padding-block: 12px; }
  header { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  h1 { font: 700 18px var(--mono); margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--ok); }
  .aide { color: var(--ink2); font-size: 14px; flex: 1 1 280px; min-width: 0; }
  .bt.primaire { background: var(--ok); border-color: var(--ok); color: var(--card); display: inline-flex; align-items: center; gap: 7px; }
  .bt.primaire svg { width: 11px; height: 11px; fill: currentColor; }
  .barre { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .bt { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font: 600 12.5px var(--mono); min-height: 34px; transition: border-color .15s, background-color .15s; }
  .bt:hover { border-color: var(--ink2); }
  .bt[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .bt.ico { min-width: 34px; font-size: 16px; padding: 4px 8px; }
  :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; min-height: 0; }
  .toile { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
  svg.pan { cursor: grabbing; }
  .zoom { position: absolute; left: 10px; bottom: 10px; font: 12px var(--mono); color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; pointer-events: none; }
  .legende { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; pointer-events: none; max-width: calc(100% - 140px); }
  .legende i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; border: 1.5px solid; vertical-align: -1px; margin-right: 5px; }
  .lg-core { background: var(--ok-s); border-color: var(--ok); } .lg-ext { background: var(--amb-s); border-color: var(--amb); }
  .lg-infra { background: var(--blu-s); border-color: var(--blu); } .lg-opt { border-style: dashed; border-color: var(--ok); }
  aside { min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 16px; }
  aside h2 { font: 700 17px var(--mono); margin: 4px 0 6px; letter-spacing: -.01em; }
  aside p { margin: 8px 0; color: var(--ink2); font-size: 15px; }
  .exs { display: grid; gap: 4px; margin: 10px 0 4px; }
  .exi { font: 600 12.5px var(--mono); color: var(--ok); background: var(--ok-s); border-radius: 3px; padding: 3px 8px; }
  .exi b { font-weight: 700; }
  aside h3 { font: 600 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 16px 0 6px; }
  .fil { display: flex; flex-wrap: wrap; gap: 4px; font: 12px var(--mono); }
  .fil button { background: none; border: 0; padding: 0; color: var(--ok); text-decoration: underline; }
  .fil span { color: var(--ink2); }
  .tag { display: inline-block; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 3px; border: 1px solid; margin-bottom: 4px; }
  .tag.core { color: var(--ok); background: var(--ok-s); border-color: var(--ok); } .tag.ext { color: var(--amb); background: var(--amb-s); border-color: var(--amb); }
  .tag.infra { color: var(--blu); background: var(--blu-s); border-color: var(--blu); } .tag.plain, .tag.user, .tag.chip { color: var(--ink2); background: var(--mut-s); border-color: var(--line); }
  .tag.opt { color: var(--ok); border-color: var(--ok); border-style: dashed; }
  .code { font: 12.5px var(--mono); list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
  .code li { background: var(--mut-s); border-radius: 3px; padding: 3px 7px; overflow-wrap: anywhere; }
  .kids { display: flex; flex-wrap: wrap; gap: 6px; }
  .kids button { background: var(--mut-s); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; font: 12px var(--mono); }
  .kids button:hover { border-color: var(--ink2); }
  ol.guide { padding-left: 18px; margin: 8px 0; color: var(--ink2); font-size: 15px; }
  kbd { font: 600 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--mut-s); }

  /* Bandeau du mode présentation : lisible à distance (titre 24 à 36 px, texte 18 à 24 px) */
  .bandeau { position: absolute; left: 14px; right: 14px; bottom: 14px; display: grid; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 20px 14px; box-shadow: 0 8px 28px var(--ombre); }
  .prog { height: 4px; background: var(--mut-s); border-radius: 2px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .b-haut { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 4px; }
  .kicker { font: 600 clamp(12px, 1vw, 15px) var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .b-ex { display: flex; flex-wrap: wrap; gap: 6px; }
  .b-ex span { font: 700 clamp(12px, 1vw, 15px) var(--mono); color: var(--ok); background: var(--ok-s); border: 1px solid var(--ok); border-radius: 3px; padding: 1px 8px; }
  .bandeau h2 { font: 700 clamp(22px, 2.3vw, 36px)/1.2 var(--sans); margin: 0; text-wrap: balance; }
  .bandeau p { font-size: clamp(17px, 1.55vw, 24px); line-height: 1.45; margin: 0; max-width: 78ch; color: var(--ink2); }
  .b-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .b-nav .bt { min-height: 44px; font-size: 14px; padding: 8px 14px; }
  .b-nav .pos { font: 600 14px var(--mono); color: var(--ink2); font-variant-numeric: tabular-nums; margin-inline: 4px auto; }
  .app.pres main { grid-template-columns: minmax(0, 1fr); }
  .app.pres aside, .app.pres .aide, .app.pres .zoom { display: none; }
  .app.pres .legende { top: 10px; bottom: auto; }
  ol.guide li { margin: 4px 0; }

  /* Éléments SVG */
  .box { stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .k-core { fill: var(--ok-s); stroke: var(--ok); } .k-ext { fill: var(--amb-s); stroke: var(--amb); }
  .k-infra { fill: var(--blu-s); stroke: var(--blu); } .k-plain, .k-chip { fill: var(--card); stroke: var(--line); }
  .k-opt { fill: var(--card); stroke: var(--ok); stroke-dasharray: 7 5; } .k-user { fill: var(--mut-s); stroke: var(--ink2); }
  .k-chip.issue { fill: var(--ok-s); stroke: var(--ok); }
  .blk { cursor: pointer; transition: opacity .25s; }
  .blk:hover .box { stroke-width: 2.4; }
  .blk:focus { outline: none; }
  .blk:focus-visible .box { stroke: var(--ok); stroke-width: 4; }
  .blk.dim { opacity: .2; }
  .blk.off { opacity: 0; pointer-events: none; }
  .blk.sel .box { stroke-width: 3.2; stroke: var(--ink); }
  .blk .det, .blk .det2 { transition: opacity .25s; } .blk .det.off, .blk .det2.off { opacity: 0; }
  .tt { fill: var(--ink); font-family: var(--sans); font-weight: 700; } .ts { fill: var(--ink2); font-family: var(--sans); }
  .td { fill: var(--ink); font-family: var(--sans); } .tm { fill: var(--ink); font-family: var(--mono); font-weight: 600; text-anchor: middle; }
  .edge { fill: none; stroke: var(--ink2); stroke-width: 1.6; vector-effect: non-scaling-stroke; transition: opacity .25s; }
  .edge.dash { stroke-dasharray: 6 5; stroke: var(--amb); }
  .edge.off, .elab.off { opacity: 0; }
  .elab { font: 600 20px var(--mono); fill: var(--ink2); paint-order: stroke; stroke: var(--card); stroke-width: 6px; transition: opacity .25s; }
  .ar { fill: var(--ink2); }
  @media (max-width: 860px) {
    body { overflow: auto; } .app { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
    aside { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { .blk, .edge, .elab, .det, .det2, .prog i { transition: none; } }
</style>

<div class="app" id="app">
  <header>
    <h1>KALDERA<span>/</span>architecture</h1>
    <div class="aide">Molette ou pincement pour zoomer, glisser pour déplacer, clic (ou <kbd>Tab</kbd> puis <kbd>Entrée</kbd>) sur un bloc pour zoomer dessus.</div>
    <div class="barre" role="toolbar" aria-label="Présentation et niveaux de zoom">
      <button class="bt primaire" id="presenter" aria-pressed="false" title="Touche P"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5 9.5 5 1 9.5z"/></svg>Présenter</button>
      <button class="bt" data-niv="1">1 · Contexte</button>
      <button class="bt" data-niv="2">2 · Plateforme</button>
      <button class="bt" data-niv="3">3 · Moteur</button>
      <button class="bt" data-niv="4">4 · Détails</button>
      <button class="bt ico" id="moins" aria-label="Dézoomer">−</button>
      <button class="bt ico" id="plus" aria-label="Zoomer">+</button>
      <button class="bt" id="fit">Ajuster</button>
    </div>
  </header>
  <main>
    <div class="toile" id="toile">
      <svg id="svg" role="group" aria-label="Carte zoomable de l'architecture Kaldera : utilisateurs, console, moteur d'agents, partenaire anti-fraude et livraison sur Google Cloud"></svg>
      <div class="zoom" id="zoom">×1,0</div>
      <div class="legende" aria-hidden="true">
        <span><i class="lg-core"></i>équipe Kaldera</span><span><i class="lg-ext"></i>partenaire</span>
        <span><i class="lg-infra"></i>livraison</span><span><i class="lg-opt"></i>facultatif</span>
      </div>
      <section class="bandeau" id="bandeau" hidden aria-label="Présentation pas à pas" aria-live="polite">
        <div class="prog" aria-hidden="true"><i id="prog"></i></div>
        <div class="b-haut"><span class="kicker" id="b-kicker"></span><span class="b-ex" id="b-ex"></span></div>
        <h2 id="b-titre"></h2>
        <p id="b-texte"></p>
        <div class="b-nav">
          <button class="bt" id="prec">← Précédent</button>
          <button class="bt" id="suiv">Suivant →</button>
          <span class="pos" id="b-pos"></span>
          <button class="bt" id="quitter">Quitter <kbd>Échap</kbd></button>
        </div>
      </section>
    </div>
    <aside id="panneau" aria-live="polite"></aside>
  </main>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg", WW = 2400, WH = 1500;
  var $ = function (id) { return document.getElementById(id); };
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Les blocs : coordonnées absolues dans un monde de 2400 × 1500 ---------- */
  var BL = [];
  function b(id, parent, kind, x, y, w, h, title, sub, det, more, desc, code, extra) {
    var o = { id: id, parent: parent, kind: kind, x: x, y: y, w: w, h: h, title: title, sub: sub,
              det: det || [], more: more || [], desc: desc, code: code || [], reveal: 1.2, detR: 2.4, moreR: 3.8 };
    for (var k in (extra || {})) o[k] = extra[k];
    BL.push(o);
  }

  b("users", null, "user", 30, 520, 320, 220, "Utilisateurs", "assuré · gestionnaire · expert",
    ["Assuré : reçoit son rapport", "Gestionnaire : reprend les", "escalades, examine les photos", "Expert : contrôle les faits"], [],
    "<p>Trois publics. L'assuré reçoit la version courte du rapport, sans le détail anti-fraude. Le gestionnaire reprend les dossiers escaladés (files <b>gestionnaire</b> et <b>cellule_fraude</b>) avec le rapport complet, et <b>examine les photos</b> : le système n'en juge jamais le contenu.</p><p>Un <b>expert d'assurance</b> peut contrôler les faits en cas de besoin. Son retour vers le système (nouveaux constats, nouvelle décision) n'est pas encore branché : c'est une évolution possible.</p>",
    ["src/kaldera/rapport.py"]);

  b("console", null, "core", 440, 100, 1100, 1000, "Console Kaldera", "Cloud Run · europe-west9 · image Docker", [], [],
    "<p>Le service Kaldera, déployé sur Cloud Run. Il porte l'interface web et le moteur d'équipe, et appelle le partenaire en A2A.</p><p>Il détecte si le partenaire est <b>simulé</b> ou <b>réel</b> et refuse de forcer une panne sur le service réel.</p>",
    ["src/kaldera/web.py", "Dockerfile", "scripts/deployer_console.sh"], { reveal: 1.2 });

  b("web", "console", "plain", 480, 215, 500, 110, "Interface web", "FastAPI · console.html",
    ["Importer les pièces, rejouer, lire", "fiches, rapports et métriques"], [],
    "<p>Console FastAPI : des boutons importent les pièces du dossier (contrat, déclaration, factures, photos, plainte) ; la liste des 28 scénarios de test est repliée. Rejeu contre le partenaire, réglage du partenaire simulé, fiches, rapports, traces et métriques par agent. Une demande peut aussi être soumise en JSON.</p>",
    ["src/kaldera/web.py", "src/kaldera/console.html"]);

  b("extraction", "console", "core", 1000, 215, 500, 110, "Analyse de dossier", "pièces → demande à valider",
    ["PDF lus, photos jamais jugées", "une fiche à relire avant traitement"], ["champs, ou gpt-5.4-mini (facultatif)"],
    "<p>Transforme les pièces importées (contrat, déclaration, factures, photos, dépôt de plainte, ou un dossier complet en un PDF) en demande au format du §3, plus une <b>fiche à valider</b> avant tout traitement.</p><p>Deux extracteurs derrière une <b>seule validation</b> : la lecture par champs, déterministe (défaut), ou le modèle gpt-5.4-mini, facultatif (<b>KALDERA_EXTRACTION</b>). Le contenu du PDF est une donnée, jamais une consigne ; champ obligatoire absent ou illisible : le traitement est bloqué.</p><p><b>Photos</b> : seule leur présence et leur format (JPEG ou PNG) sont vérifiés, jamais ce qu'elles montrent ; la fiche écrit « jointe, contenu non analysé ». Les 15 dossiers de test de bout en bout, en deux variantes (étiquetée et texte libre), sont dans <b>exemples/cas/</b>.</p>",
    ["src/kaldera/extraction.py", "exemples/cas/", "scripts/generer_cas_exemples.py"]);

  b("moteur", "console", "plain", 480, 350, 1020, 540, "Moteur d'équipe", "superviseur-décideur · ordre fixe", [], [],
    "<p>L'équipe d'agents. Le superviseur-décideur appelle les agents dans un ordre fixe, s'arrête dès qu'une règle du §10 conclut, et est le seul à écrire l'état.</p><p>Chaque demande finit par une décision ou une escalade motivée, jamais par un silence (E1).</p>",
    ["src/kaldera/superviseur.py", "src/kaldera/__init__.py"], { reveal: 1.8 });

  b("superviseur", "moteur", "core", 510, 455, 300, 200, "Superviseur-décideur", "enchaîne, borne, conclut",
    ["ordre fixe, un seul écrivain", "contrôle de forme des sorties", "filet : jamais sans issue"],
    ["bornes : 12 étapes · 8 s", "2 compléments, arrêt si idem", "trace : agent · action · ecrit"],
    "<p>Enchaîne les agents, vérifie la forme de chaque sortie, applique les bornes et conclut la demande. Il est l'auteur de la section <b>issue</b>.</p><p>Un agent défaillant ou indéterminé, ou une borne atteinte, donne une escalade motivée avec <b>arret</b> rempli.</p>",
    ["src/kaldera/superviseur.py", "src/kaldera/bornes.py"]);

  b("elig", "moteur", "plain", 860, 450, 290, 90, "1 · Éligibilité", "le contrat couvre-t-il ?", ["écrit : eligibilite"], [],
    "<p>Le contrat couvre-t-il ce sinistre ? Contrat actif, cotisations à jour, carence de 30 jours, délai de déclaration, garantie de la formule.</p><p>Ne chiffre jamais : le plafond n'est pas son affaire.</p>",
    ["src/kaldera/agents/eligibilite.py"]);
  b("pieces", "moteur", "plain", 1180, 450, 290, 90, "2 · Pièces", "présentes et lisibles ?", ["écrit : pieces"], [],
    "<p>Les pièces exigées sont-elles présentes et lisibles ? Elle <b>demande</b> un complément ; le superviseur l'<b>exécute</b> en lisant le dépôt suivant, au plus 2 fois, et s'arrête si le dépôt est identique.</p><p><b>Photo</b> : exigée (présence), mais son contenu n'est pas jugé. L'agent la déclare « non analysée » dans sa section, pour que le rapport la signale à un humain.</p>",
    ["src/kaldera/agents/pieces.py", "src/kaldera/espace_assure.py"]);
  b("estim", "moteur", "plain", 860, 560, 290, 90, "3 · Estimation", "combien rembourser ?", ["écrit : estimation · plafond"], [],
    "<p>Combien rembourser ? Montant retenu moins la franchise, puis plafonné par la formule.</p><p><b>Frontière tranchée :</b> le plafond est un montant, donc l'Estimation l'applique et le signale (NOM-05).</p>",
    ["src/kaldera/agents/estimation.py"]);
  b("anti", "moteur", "plain", 1180, 560, 290, 90, "4 · Anti-fraude", "consulte le partenaire", ["écrit : avis_fraude · F1 à F4"], [],
    "<p>Calcule les indicateurs F1 à F4 et, si l'un d'eux est présent, consulte le partenaire. N'émet jamais d'avis lui-même.</p><p>Une réponse invalide, absente ou en doublon donne un avis <b>indisponible</b>.</p>",
    ["src/kaldera/agents/antifraude.py", "src/kaldera/partenaire.py"]);

  b("etat", "moteur", "plain", 510, 680, 460, 200, "État partagé", "un seul écrivain", [], [],
    "<p>L'état d'une demande, en mémoire : cinq sections métier plus l'exécution. Les agents n'ont <b>aucun droit d'écriture</b> : ils renvoient un résultat, le superviseur l'enregistre au nom de l'agent. Chaque agent ne lit que sa vue (moindre privilège).</p>",
    ["src/kaldera/etat.py", "src/kaldera/vues.py"], { reveal: 3.0 });

  var chips = [
    ["eligibilite", "Résultat de l'éligibilité : éligible ou non, et les conditions du §4 non remplies. Auteur : Éligibilité."],
    ["pieces", "Pièces conformes ou à redemander, factures lisibles. Plusieurs versions possibles, une par complément, toutes du même auteur."],
    ["estimation", "Montants justifié, retenu et estimé, franchise, plafond et plafond_applique. Auteur : Estimation."],
    ["avis_fraude", "non_requis, obtenu (niveau, score, evaluation_id) ou indisponible, avec la couche de rejet. Auteur : Anti-fraude."],
    ["issue", "La conclusion : décision ou escalade, montant, file, motif, mode dégradé, règle appliquée. Seul le superviseur l'écrit."],
    ["execution", "Trace en ajout seul (agent, action, ecrit, statut, durée) et borne atteinte (arret). Écrite par le superviseur, hors sections métier."]
  ];
  chips.forEach(function (c, i) {
    b("s_" + c[0], "etat", "chip", 525 + (i % 3) * 145, 780 + Math.floor(i / 3) * 52, 135, 42, c[0], "", [], [],

      "<p>Cliquez sur un bloc : la carte zoome dessus et ce panneau l'explique, avec les fichiers du code et les exigences qu'il couvre.</p>" +

      "<h3>Exigences du brief</h3><div class='exs'>" + Object.keys(EXIG).map(function (e) { return "<span class='exi'><b>" + e + "</b> · " + EXIG[e] + "</span>"; }).join("") + "</div>";
  }
  function select(o) {
    if (sel) P[sel].g.classList.remove("sel");
    sel = o ? o.id : null;
    if (!o) return guide();
    o.g.classList.add("sel");
    var chemin = [], q = o; while (q) { chemin.unshift(q); q = q.parent ? P[q.parent] : null; }
    var h = "<div class='fil'>" + chemin.map(function (c, i) {
      return (i ? "<span>›</span>" : "") + (c === o ? "<span>" + c.title + "</span>" : "<button data-go='" + c.id + "'>" + c.title + "</button>");
    }).join("") + "</div>";
    h += "<h2>" + o.title + (o.sub && o.kind !== "chip" ? "" : "") + "</h2><span class='tag " + o.kind + "'>" + NOMS[o.kind] + "</span>";
    if (o.sub) h += "<p><i>" + o.sub + "</i></p>";
    if (EX[o.id]) h += "<div class='exs' aria-label='Exigences du brief'>" + EX[o.id].map(function (e) { return "<span class='exi'><b>" + e + "</b> · " + EXIG[e] + "</span>"; }).join("") + "</div>";
    h += o.desc;
    if (o.kids.length) h += "<h3>Contient</h3><div class='kids'>" + o.kids.map(function (k) { return "<button data-go='" + k.id + "'>" + k.title + "</button>"; }).join("") + "</div>";
    if (o.code.length) h += "<h3>Dans le code</h3><ul class='code'>" + o.code.map(function (c) { return "<li>" + c + "</li>"; }).join("") + "</ul>";
    $("panneau").innerHTML = h;
  }
  function aller(id) { var o = P[id]; select(o); zoomerSur(o); }

  var etape = -1;
  function ancre(h) { try { history.replaceState(null, "", h || location.pathname + location.search); } catch (e) { /* cadre sans historique */ } }
  function montrer(n) {
    etape = Math.max(0, Math.min(ETAPES.length - 1, n));
    var e = ETAPES[etape];
    $("b-kicker").textContent = "Étape " + (etape + 1) + " / " + ETAPES.length + " · " + e.k;
    $("b-ex").innerHTML = e.ex.map(function (x) { return "<span title='" + EXIG[x] + "'>" + x + "</span>"; }).join("");
    $("b-titre").textContent = e.t;
    $("b-texte").textContent = e.x;
    $("b-pos").textContent = (etape + 1) + " / " + ETAPES.length;
    $("prog").style.width = ((etape + 1) / ETAPES.length * 100) + "%";
    $("prec").disabled = etape === 0; $("suiv").disabled = etape === ETAPES.length - 1;
    if (sel) { P[sel].g.classList.remove("sel"); sel = null; }
    mettreEnAvant(e.f);
    cadrer(e.f);
    ancre("#etape-" + (etape + 1));
  }
  function presenter(n) {
    $("app").classList.add("pres"); $("bandeau").hidden = false; $("presenter").setAttribute("aria-pressed", "true");
    mesurer(); montrer(n || 0);
  }
  function quitter() {
    if (etape < 0) return;
    etape = -1; $("app").classList.remove("pres"); $("bandeau").hidden = true; $("presenter").setAttribute("aria-pressed", "false");
    mettreEnAvant(null); mesurer(); select(null); ajuster(); ancre();
  }
  $("presenter").addEventListener("click", function () { if (etape < 0) presenter(0); else quitter(); });
  $("prec").addEventListener("click", function () { montrer(etape - 1); });
  $("suiv").addEventListener("click", function () { montrer(etape + 1); });
  $("quitter").addEventListener("click", quitter);
  $("panneau").addEventListener("click", function (e) { var t = e.target.closest("[data-go]"); if (t) aller(t.dataset.go); });

  /* ---------- Entrées : molette, glisser, pincement, clavier ---------- */
  var ptrs = new Map(), bouge = 0, pincement = 0;
  function local(e) { var rc = svg.getBoundingClientRect(); return [e.clientX - rc.left, e.clientY - rc.top]; }
  svg.addEventListener("wheel", function (e) {
    e.preventDefault(); var p = local(e);
    zoomAutour(p[0], p[1], Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0018)));
  }, { passive: false });
  svg.addEventListener("pointerdown", function (e) {
    svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, local(e)); bouge = 0;
    if (anim) cancelAnimationFrame(anim);
    if (ptrs.size === 2) { var v = Array.from(ptrs.values()); pincement = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]); }
  });
  svg.addEventListener("pointermove", function (e) {
    if (!ptrs.has(e.pointerId)) return;
    var avant = ptrs.get(e.pointerId), p = local(e); ptrs.set(e.pointerId, p);
    if (ptrs.size === 1) {
      view.x += p[0] - avant[0]; view.y += p[1] - avant[1]; bouge += Math.abs(p[0] - avant[0]) + Math.abs(p[1] - avant[1]);
      if (bouge > 5) svg.classList.add("pan"); maj();
    } else if (ptrs.size === 2) {
      var v = Array.from(ptrs.values()), d = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]);
      if (pincement > 0) zoomAutour((v[0][0] + v[1][0]) / 2, (v[0][1] + v[1][1]) / 2, d / pincement);
      pincement = d; bouge = 99;
    }
  });
  function fin(e) {
    var etaitSeul = ptrs.size === 1; ptrs.delete(e.pointerId); svg.classList.remove("pan");
    if (ptrs.size < 2) pincement = 0;
    if (etaitSeul && bouge <= 5 && e.type === "pointerup") {
      var cible = document.elementFromPoint(e.clientX, e.clientY), bl = cible && cible.closest ? cible.closest(".blk") : null;
      if (bl && !bl.classList.contains("off")) { if (etape >= 0) zoomerSur(P[bl.dataset.id]); else aller(bl.dataset.id); }
    }
  }
  svg.addEventListener("pointerup", fin); svg.addEventListener("pointercancel", fin);
  svg.addEventListener("dblclick", function (e) { if (!e.target.closest || !e.target.closest(".blk")) { select(null); ajuster(); } });
  svg.addEventListener("keydown", function (e) {
    var bl = e.target.closest && e.target.closest(".blk");
    if (bl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); if (etape >= 0) zoomerSur(P[bl.dataset.id]); else aller(bl.dataset.id); }
  });
  window.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var surBouton = e.target.tagName === "BUTTON";
    if ((e.key === "p" || e.key === "P") && !surBouton) { e.preventDefault(); if (etape < 0) presenter(0); else quitter(); return; }
    if (etape >= 0) {
      var avance = e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !surBouton);
      var recule = e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace";
      if (avance || recule || e.key === "Home" || e.key === "End" || e.key === "Escape") e.preventDefault();
      if (avance) return montrer(etape + 1);
      if (recule) return montrer(etape - 1);
      if (e.key === "Home") return montrer(0);
      if (e.key === "End") return montrer(ETAPES.length - 1);
      if (e.key === "Escape") return quitter();
    }
    if (surBouton && e.key !== "+" && e.key !== "-") return;
    if (e.key === "+" || e.key === "=") zoomAutour(cw / 2, ch / 2, 1.3);
    else if (e.key === "-") zoomAutour(cw / 2, ch / 2, 1 / 1.3);
    else if (e.key === "0" || e.key === "Escape") { select(null); ajuster(); }
  });
  $("plus").addEventListener("click", function () { zoomAutour(cw / 2, ch / 2, 1.5); });
  $("moins").addEventListener("click", function () { zoomAutour(cw / 2, ch / 2, 1 / 1.5); });
  $("fit").addEventListener("click", function () { select(null); ajuster(); });
  document.querySelectorAll("[data-niv]").forEach(function (x) { x.addEventListener("click", function () { versNiveau(+x.dataset.niv); }); });

  function init() {
    mesurer(); ajuster(true); guide();
    var m = /^#etape-(\d+)$/.exec(location.hash), b = /^#bloc-([a-z_]+)$/.exec(location.hash);
    if (m) presenter(+m[1] - 1); else if (b && P[b[1]]) aller(b[1]);
  }
  if (window.ResizeObserver) {
    var premier = true;
    new ResizeObserver(function () {
      var r0 = view.s / f; mesurer();
      if (premier) {
        premier = false;
        if (etape >= 0) cadrer(ETAPES[etape].f, true); else if (sel) zoomerSur(P[sel]); else ajuster(true);
      } else { view.s = r0 * f; maj(); }
    }).observe($("toile"));
  }
  init();
})();
</script>
</html>
